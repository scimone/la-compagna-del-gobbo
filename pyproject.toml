[project]
name = "la-compagna-del-gobbo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-modeltranslation>=0.20.6",
    "django-ninja>=1.7.0",
    "django-pwa>=2.0.1",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# These __init__.py files import their sibling endpoint modules purely for the
# side effect of registering routes on the shared `router` (blueprint pattern).
"apps/*/api/**/__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
