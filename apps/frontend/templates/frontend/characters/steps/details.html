{% extends "frontend/characters/wizard_base.html" %}
{% load i18n %}
{% block step %}
  <p class="hint">{% translate "Optional. Let your background and species inspire your character's past, and answer as if you were them." %}</p>
  <form method="post">
    {% csrf_token %}
    <div><label for="appearance">{% translate "Appearance" %}</label>
      <textarea id="appearance" name="appearance">{{ character.appearance }}</textarea></div>
    {% for i, question, answer in questions %}
      <div><label for="b{{ i }}">{{ question }}</label>
        <textarea id="b{{ i }}" name="backstory.{{ i }}">{{ answer }}</textarea></div>
    {% endfor %}
    <div><label for="notes">{% translate "Notes" %}</label>
      <textarea id="notes" name="notes">{{ character.notes }}</textarea></div>
    <div class="actions"><button type="submit" class="btn">{% translate "Save and continue" %}</button></div>
  </form>
{% endblock %}
