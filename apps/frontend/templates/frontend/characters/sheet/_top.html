{% load i18n %}
{# The part of the sheet that never scrolls away: just the tab strip. Who the character is       #}
{# (portrait, name, level, class, species, background, size) lives in the Biography tab now.     #}
<div class="cs-top">
  <div class="cs-tabbar">
    <nav class="cs-tabs" role="tablist" aria-label="{% translate 'Character sections' %}">
      {% for key, label in sheet_tabs %}
        <button type="button" role="tab" data-tab="{{ key }}" class="{% if key == sheet_tab %}active{% endif %}"
                aria-selected="{% if key == sheet_tab %}true{% else %}false{% endif %}">{{ label }}</button>
      {% endfor %}
    </nav>
  </div>
</div>
