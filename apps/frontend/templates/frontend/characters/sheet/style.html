{# The character sheet's CSS (dropped into base.html's <style>). Everything is scoped under #cs, #}
{# and uses only base.html's colour variables, so dark mode needs nothing of its own.           #}
  /* The sheet owns the whole space between the app header and the bottom nav: the top block
     never scrolls, `.cs-body` below it does - that is what keeps the header sticky. */
  main { padding: 0; gap: 0; overflow: hidden; }
  #cs, #cs-swap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #cs { --cs-pad: max(1rem, calc((100% - 46rem) / 2)); }
  #cs [hidden] { display: none !important; }
  /* :where() keeps this at zero specificity, so a button's own class can still set its colour. */
  :where(#cs) button { font: inherit; color: inherit; }
  #cs button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #cs h3 { margin: 0 0 0.5rem; font-size: 1rem; }
  #cs h4 { margin: 0.7rem 0 0.4rem; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  #cs .dim { color: var(--muted); font-weight: 400; font-size: 0.85em; }
  #cs .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #cs input[type="number"], #cs input[type="text"], #cs select, #cs textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem;
  }
  #cs input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  #cs input[type="number"]::-webkit-outer-spin-button, #cs input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #cs :disabled { cursor: default; }

  /* --- the fixed top: just the tabs now; who the character is lives in the Biography tab. ----- */
  .cs-top { flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  #cs .chev { display: inline-block; width: 0.5rem; height: 0.5rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.15s; flex-shrink: 0; }

  /* Identity, in the Biography tab: the portrait on the left, everything else - name, level,
     class, species, background, size, alignment - as properties on the right. */
  .cs-identity { display: flex; align-items: flex-start; gap: 1rem; padding: 0.9rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.8rem; }
  .cs-pic { position: relative; flex-shrink: 0; }
  .cs-portrait { position: relative; display: block; width: 6.5rem; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--border); border-radius: 0.7rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    background: linear-gradient(170deg, color-mix(in srgb, var(--accent) 20%, var(--bg)), var(--bg)); }
  label.cs-portrait { cursor: pointer; }
  label.cs-portrait:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cs-portrait svg { display: block; width: 100%; height: 100%; fill: color-mix(in srgb, var(--muted) 55%, transparent); }
  .cs-portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  /* Small badges for the owner: "+" (choose a picture) at the bottom, "x" (remove it) at the corner. */
  .cs-pic-add { position: absolute; right: 0.15rem; bottom: 0.15rem; display: grid; place-items: center; width: 1.05rem; height: 1.05rem; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
  .cs-pic-add svg { width: 0.7rem; height: 0.7rem; fill: none; stroke: var(--accent-text); stroke-width: 3; stroke-linecap: round; }
  .cs-pic-x { position: absolute; top: -0.4rem; right: -0.4rem; display: grid; place-items: center; width: 1.2rem; height: 1.2rem; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; color: var(--muted); font-size: 0.9rem; line-height: 1; cursor: pointer; }
  .cs-who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .cs-name-row { display: flex; align-items: center; gap: 0.3rem; }
  .cs-name { flex: 1; min-width: 0; margin: 0; padding: 0.1rem 0.3rem; font-size: 1.15rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  #cs input.cs-name { margin-left: -0.3rem; font-size: 1.15rem; font-weight: 700; background: transparent; border-color: transparent; text-overflow: ellipsis; }
  #cs input.cs-name:hover, #cs input.cs-name:focus { background: var(--bg); border-color: var(--border); }
  .cs-lvl { display: flex; align-items: center; flex-wrap: wrap; gap: 0.2rem 0.5rem; min-width: 0; }
  .cs-level { padding: 0.05rem 0.6rem; background: var(--accent); border-radius: 1rem; color: var(--accent-text); font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .cs-owner { color: var(--muted); font-size: 0.75rem; }
  .cs-class { min-width: 0; font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-class a, .cs-facts a { color: inherit; text-decoration: none; }
  .cs-class .dim { font-weight: 400; }
  /* Species, background, size, alignment: small labelled facts, wrapping as needed. */
  .cs-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr)); gap: 0.5rem 0.8rem; margin: 0; padding-top: 0.5rem; border-top: 1px solid var(--border); }
  .cs-facts > div { min-width: 0; }
  .cs-facts dt { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  .cs-facts dd { margin: 0; font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The Stats tab: a dashboard of cards on a 12-column grid. Small cards are 4 or 6 wide, big ones
     span the row. Hit Dice and Death Saves share a line even on a phone, so they are kept narrow:
     the death save labels shrink to their symbol there. */
  .cs-stats { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0.6rem; }
  .cs-card { grid-column: span 12; min-width: 0; padding: 0.8rem 0.9rem; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
  .cs-card.third { grid-column: span 4; }
  .cs-card.half { grid-column: span 6; }
  .cs-card .k { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; line-height: 1.2; }
  .cs-card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .cs-card input[type="number"] { text-align: center; background: var(--bg); }
  .cs-bar { height: 0.5rem; margin-top: 0.6rem; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; }
  .cs-bar i { display: block; width: var(--pct); height: 100%; background: var(--accent); border-radius: 1rem; transition: width 0.25s; }
  .cs-bar.hp { height: 0.7rem; margin-top: 0.8rem; }
  .xp-val { display: inline-flex; align-items: baseline; gap: 0.35rem; font-size: 0.95rem; }
  #cs .xp-val input { width: 5rem; padding: 0.15rem 0; font-size: 1rem; font-weight: 700; }
  .xp-val b { font-size: 1.1rem; }
  .xp-val .of { color: var(--muted); }
  /* Hit points: the centrepiece. */
  .cs-hp { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface)); }
  .cs-temp { display: inline-flex; align-items: center; gap: 0.4rem; }
  #cs .cs-temp input { width: 3.4rem; padding: 0.1rem 0; font-weight: 700; }
  .cs-hp-main { display: flex; align-items: center; justify-content: center; gap: 1.1rem; margin-top: 0.5rem; }
  .hp-val { display: inline-flex; align-items: baseline; gap: 0.4rem; }
  #cs .hp-val input, .hp-val b { width: 5.2rem; padding: 0; font-size: 2.6rem; font-weight: 800; line-height: 1.15; text-align: center; }
  .hp-val b { width: auto; }
  .hp-val .of { color: var(--muted); font-size: 1.3rem; font-weight: 600; }
  .step { flex-shrink: 0; width: 2.9rem; height: 2.9rem; padding: 0; line-height: 1; font-size: 1.6rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); cursor: pointer; }
  .step:active:not(:disabled) { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  /* Combat tiles: the number big, its name under it. */
  .cs-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem; padding: 0.9rem 0.4rem; text-align: center; }
  .cs-tile .v { font-size: 2rem; font-weight: 800; line-height: 1; }
  .ac-emblem { position: relative; display: grid; place-items: center; width: 3.3rem; height: 3.6rem; }
  .ac-emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: color-mix(in srgb, var(--accent) 13%, var(--surface)); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
  .ac-emblem .v { position: relative; font-size: 1.6rem; margin-top: -0.15rem; }
  .cs-shield { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1rem 0.6rem 0.1rem 0.45rem; background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; color: var(--muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; }
  .cs-shield svg { width: 0.85rem; height: 0.85rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .cs-shield.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .cs-shield.on svg { fill: currentColor; }
  button.cs-insp { cursor: pointer; }
  button.cs-insp:disabled { cursor: default; }
  .cs-insp svg { width: 2.1rem; height: 2.1rem; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
  .cs-insp.on { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: var(--accent); }
  .cs-insp.on svg { fill: var(--accent); stroke: var(--accent); }
  /* Resources: hit dice pips (the Spellbook's pip look) and the death save boxes. */
  .cs-hd-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.6rem; }
  .cs-hd-row .lbl { flex: 0 0 auto; min-width: 1.8rem; font-size: 0.95rem; font-weight: 700; }
  .cs-hd-row .cnt, .cs-slot-row .cnt { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .cs-hd-row .cnt b { color: var(--text); }
  .cs-hd-row .cs-pips { flex: 1; }
  .cs-death .death-line { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.6rem; }
  .death-line .lbl { font-size: 0.9rem; font-weight: 600; }
  .death-line .lbl i { display: inline-block; width: 1rem; color: var(--muted); font-style: normal; }
  .death-line .boxes { display: inline-flex; gap: 0.35rem; }
  .box { width: 1.5rem; height: 1.5rem; padding: 0; border: 2px solid var(--muted); border-radius: 50%; background: none; cursor: pointer; }
  .box.on.successes { background: var(--accent); border-color: var(--accent); }
  .box.on.failures { background: var(--text); border-color: var(--text); }
  @media (max-width: 40rem) {
    .cs-death .death-line { justify-content: flex-start; gap: 0.5rem; }
    .death-line .lbl .txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .death-line .lbl i { width: auto; font-size: 1.1rem; }
    .cs-hd-row { gap: 0.4rem; }
  }

  /* Tabs: the same underline strip as the World's, but buttons - they switch panels in place. */
  .cs-tabbar { padding: 0 var(--cs-pad); background: var(--surface); }
  .cs-tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
  .cs-tabs::-webkit-scrollbar { display: none; }
  .cs-tabs button { flex-shrink: 0; padding: 0.65rem 0.95rem 0.55rem; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; font-size: 0.9rem; white-space: nowrap; cursor: pointer; }
  .cs-tabs button:first-child { padding-left: 0; }
  .cs-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .cs-tabs button:active { background: var(--bg); }

  /* --- the panels ----------------------------------------------------------------------- */
  /* A panel is a fixed part (`.cs-sticky`: what must stay in view) on top of a scrolling part
     (`.cs-scroll`). Nothing is position: sticky - the fixed part is simply not inside the scroller,
     so it cannot move at all while the list under it scrolls. */
  .cs-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cs-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cs-sticky { flex-shrink: 0; position: relative; z-index: 3; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.6rem var(--cs-pad); background: var(--surface); border-bottom: 1px solid var(--border); }
  /* The fixed part has the tab strip's colour, so it reads as part of the menu: the line between
     them goes when the tab showing has one. Cards inside it take the page colour to stay visible. */
  #cs-swap:has(.cs-panel:not([hidden]) > .cs-sticky) .cs-top { border-bottom-color: transparent; }
  .cs-sticky .cs-pb, .cs-sticky .cs-ab, .cs-sticky .cs-metric { background: var(--bg); }
  /* A heading that stays in view above a scrolling list (the skills): fixed like `.cs-sticky`, but
     on the page's own colour. */
  #cs .cs-subhead { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin: 0 var(--cs-pad); padding: 0.55rem 0 0.45rem; border-bottom: 1px solid var(--border); }
  #cs .cs-subhead h3 { margin: 0; }
  .cs-subhead + .cs-scroll { padding-top: 0.4rem; }
  .cs-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 1rem; padding: 1rem var(--cs-pad) 1.5rem; }
  .cs-scroll > * { flex-shrink: 0; }
  .cs-group { min-width: 0; }
  .cs-empty { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .cs-toast { position: fixed; left: 50%; bottom: calc(4.5rem + env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0; padding: 0.5rem 0.9rem; background: var(--accent); color: var(--accent-text); border-radius: 0.6rem; font-size: 0.85rem; z-index: 20; }

  /* Abilities: six boxes, two rows of three; pips mark proficiency. */
  .cs-pb { display: flex; align-items: center; justify-content: space-between; margin: 0; padding: 0.3rem 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; font-size: 0.85rem; color: var(--muted); }
  .cs-pb b { padding: 0 0.6rem; background: var(--accent); border-radius: 1rem; color: var(--accent-text); font-size: 0.95rem; }
  .cs-abilities { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, auto); gap: 0.4rem; }
  .cs-ab { display: flex; flex-direction: column; align-items: center; gap: 0.05rem; padding: 0.4rem 0.4rem 0.35rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.7rem; text-align: center; min-width: 0; }
  .cs-ab-name { max-width: 100%; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-ab-mod { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .cs-ab-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.2rem; width: 100%; margin-top: 0.15rem; padding-top: 0.3rem; border-top: 1px solid var(--border); }
  .cs-ab-score { padding: 0 0.4rem; font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; }
  .cs-ab-save { display: flex; align-items: center; gap: 0.2rem; font-size: 0.66rem; color: var(--muted); }
  .cs-ab-save b { color: var(--text); font-size: 0.78rem; }
  .pip { display: inline-block; width: 0.75rem; height: 0.75rem; flex-shrink: 0; border: 2px solid var(--muted); border-radius: 50%; }
  .pip.proficient { background: var(--accent); border-color: var(--accent); }
  .pip.expertise { background: var(--accent); border-color: var(--accent); margin: 3px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .cs-skills { display: grid; grid-template-columns: 1fr; gap: 0 1.5rem; margin: 0; padding: 0; list-style: none; }
  .cs-skills li { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.1rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  .cs-skills .n { flex: 1; min-width: 0; }
  .cs-skills b { min-width: 2rem; text-align: right; }
  .cs-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin: 0; font-size: 0.75rem; color: var(--muted); }
  .cs-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  @media (min-width: 40rem) { .cs-skills { grid-template-columns: 1fr 1fr; } }

  /* Expandable rows: features, spells. */
  .cs-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
  .cs-list > li { background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; overflow: hidden; }
  .cs-row { display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.5rem 0.8rem; background: none; border: 0; text-align: left; cursor: pointer; }
  .cs-row:active { background: var(--bg); }
  .cs-row .item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cs-row .item-name { font-weight: 600; }
  .cs-row .item-detail { color: var(--muted); font-size: 0.82rem; }
  .cs-row .thumb { width: 3rem; height: 3rem; flex-shrink: 0; border-radius: 0.6rem; object-fit: cover; background: var(--bg); }
  .cs-row[aria-expanded="true"] .chev { transform: rotate(-135deg); }
  #cs .desc { padding: 0.6rem 0.9rem; border-top: 1px solid var(--border); font-size: 0.9rem; line-height: 1.45; background: var(--bg); }
  #cs .desc p { margin: 0.4rem 0; }
  #cs .desc h3, #cs .desc h4 { margin: 0.7rem 0 0.2rem; font-size: 0.95rem; color: var(--text); }
  #cs .desc ul, #cs .desc ol { margin: 0.4rem 0; padding-left: 1.25rem; }
  #cs .desc ul.no-bullets { list-style: none; padding-left: 0; }
  #cs .desc .inset { padding: 0.4rem 0.8rem; margin: 0.5rem 0; background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; }
  #cs .desc table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.85rem; }
  #cs .desc th, #cs .desc td { padding: 0.25rem 0.4rem; border: 1px solid var(--border); text-align: left; }
  #cs .desc .table-scroll { overflow-x: auto; }
  #cs .desc .facts dl { display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.75rem; margin: 0 0 0.4rem; }
  #cs .desc .facts dt { color: var(--muted); font-size: 0.8rem; }
  #cs .desc .facts dd { margin: 0; }
  #cs .desc .chip-title { margin: 0 0 0.3rem; font-size: 1rem; color: var(--accent); }
  .chip-panel { margin-top: 0.5rem; border: 1px solid var(--border); border-radius: 0.6rem; }

  /* Spellbook. */
  .cs-casting { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.4rem; }
  .cs-metric { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 0.2rem 0.4rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; }
  .cs-metric .k { font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); line-height: 1.2; }
  .cs-metric b { font-size: 1.1rem; line-height: 1.2; }
  .cs-metric select { width: 100%; padding: 0.05rem 0.2rem; font-size: 0.85rem; font-weight: 600; }
  .cs-slots { display: flex; flex-direction: column; gap: 0.4rem; }
  .cs-slot-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.7rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; }
  .cs-slot-row .lbl { flex: 0 0 6.5rem; font-size: 0.85rem; font-weight: 600; }
  .cs-pips { flex: 1; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .cs-slot-row .cnt { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .cs-slot-row .cnt b { color: var(--text); }
  .pip-btn { width: 1.35rem; height: 1.35rem; padding: 0; border: 2px solid var(--accent); border-radius: 50%; background: none; cursor: pointer; }
  .pip-btn.on { background: var(--accent); }
  .cs-sticky .world-search { padding: 0; background: none; border: 0; }
  .cs-sticky .world-search-icon { pointer-events: none; }

  /* Inventory. */
  .cs-purse { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.4rem, 1fr)); gap: 0.4rem; padding: 0.4rem 0.5rem; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface)); border: 1px solid var(--border); border-radius: 0.9rem; }
  .coin { display: flex; align-items: center; gap: 0.35rem; min-width: 0; }
  .coin .disc { flex-shrink: 0; display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 50%; font-size: 0.6rem; font-weight: 800; color: #2b1d0b; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45), inset 0 -3px 5px rgba(0, 0, 0, 0.25), 0 1px 3px rgba(0, 0, 0, 0.3); }
  .coin-copper .disc { background: #c27b48; }
  .coin-silver .disc { background: #cfd3d8; }
  .coin-electrum .disc { background: #b9c7a7; }
  .coin-gold .disc { background: #e6bd45; }
  .coin-platinum .disc { background: #dfe6ec; }
  .coin input, .coin b { flex: 1; min-width: 0; padding: 0.1rem 0.2rem; font-size: 0.95rem; font-weight: 700; text-align: center; }
  .coin b { border: 1px solid transparent; }
  .cs-invbar { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .cs-add-btn { flex-shrink: 0; white-space: nowrap; padding: 0.3rem 0.9rem; background: var(--accent); border: 0; border-radius: 1rem; color: var(--accent-text); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .cs-weight { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .cs-weight b { color: var(--text); }
  .cs-warnings { margin: 0; padding: 0.6rem 0.9rem 0.6rem 1.6rem; border: 1px dashed var(--border); border-radius: 0.6rem; color: var(--muted); font-size: 0.9rem; }
  /* Gear rows are the Features/Spellbook rows; the Equip pill, the quick Sell button, or (in the
     "add an item" sheet) the Buy pill sit over the row, left of its chevron, in one small cluster
     (`.cs-actions`). The reserved margin is generous - up to two pills can share the cluster. */
  .cs-line { position: relative; }
  .cs-row .qty { color: var(--muted); font-weight: 400; font-size: 0.85em; }
  .cs-row.has-actions .item-text { margin-right: 8.6rem; }
  .cs-row.has-buy .item-text { margin-right: 7.6rem; }
  .cs-list > li.worn { border-color: var(--accent); border-left-width: 0.3rem; }
  .cs-actions { position: absolute; right: 2.1rem; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 0.35rem; }
  .equip { padding: 0.2rem 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; font-size: 0.72rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .equip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  /* Buy costs money, Add doesn't: an outline instead of Add's filled pill keeps them apart at a glance. */
  .equip.buy { background: var(--bg); border-color: var(--accent); color: var(--accent); }
  .equip.buy:active { background: var(--accent); color: var(--accent-text); }
  .btn-sell-row { flex-shrink: 0; display: grid; place-items: center; width: 1.7rem; height: 1.7rem; padding: 0; background: var(--bg); border: 1px solid var(--accent); border-radius: 50%; color: var(--accent); cursor: pointer; }
  .btn-sell-row svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn-sell-row:active { background: var(--accent); color: var(--accent-text); }

  /* Proficiencies. */
  .cs-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip { padding: 0.25rem 0.7rem; font-size: 0.82rem; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; }
  button.chip { cursor: pointer; }
  button.chip:active { background: var(--bg); }
  button.chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip small { color: var(--muted); }
  .chip.active small { color: inherit; opacity: 0.85; }
  .chip.plain { color: var(--muted); }

  /* Biography: the backstory, under the identity card above. */
  .cs-text { display: block; width: 100%; padding: 0.55rem 0.7rem; line-height: 1.45; resize: vertical; }
  .cs-prose { margin: 0; line-height: 1.5; }

  /* What you can do with an item, in the panel that unfolds under its row. */
  #cs .desc-body:empty { display: none; }
  .item-tools { display: flex; flex-direction: column; gap: 0.5rem; }
  #cs .desc-body:not(:empty) + .item-tools { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
  .qty-edit { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--muted); }
  .qty-edit span { flex: 1; }
  .qty-edit input { width: 3.6rem; padding: 0.15rem 0.3rem; text-align: center; font-weight: 600; }
  .item-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .item-buttons button { padding: 0.35rem 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .item-buttons .btn-sell { border-color: var(--accent); color: var(--accent); }
  .item-buttons .btn-remove { margin-left: auto; color: var(--muted); }
  .item-buttons button:active { background: var(--accent); color: var(--accent-text); }
  #cs .item-tools .hint { font-size: 0.75rem; }
  .equip.add { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .equip.add:disabled { background: var(--bg); border-color: var(--border); color: var(--muted); }
  .qty-edit .step { width: 1.8rem; height: 1.8rem; font-size: 1.05rem; }

  /* The "add an item" sheet: covers the whole screen, with its own fixed part and scrolling part. */
  .cs-overlay { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
  .cs-overlay-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: max(0.7rem, env(safe-area-inset-top)) var(--cs-pad) 0.6rem; background: var(--surface); border-bottom: 1px solid var(--border); }
  .cs-overlay-head h3 { margin: 0; font-size: 1.1rem; }
  /* The language switch (the overlay covers base.html's own) and the Done button. */
  .cs-overlay-actions { display: flex; align-items: center; gap: 0.6rem; }
  .cs-overlay-close { padding: 0.35rem 1rem; background: var(--accent); border: 0; border-radius: 1rem; color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .cs-overlay-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  .cs-seg { display: flex; border: 1px solid var(--border); border-radius: 0.6rem; overflow: hidden; }
  .cs-seg button { flex: 1; padding: 0.4rem 0.6rem; background: var(--bg); border: 0; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .cs-seg button.active { background: var(--accent); color: var(--accent-text); }
  .cs-form { display: flex; flex-direction: column; gap: 0.7rem; }
  .cs-form label { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; font-size: 0.85rem; color: var(--muted); }
  .cs-form input[type="text"], .cs-form input[type="number"], .cs-form select, .cs-form textarea { width: 100%; padding: 0.5rem 0.6rem; color: var(--text); }
  .cs-form label.check { flex-direction: row; align-items: center; gap: 0.5rem; }
  .cs-form-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
  .btn-primary { padding: 0.65rem 1rem; background: var(--accent); border: 0; border-radius: 0.6rem; color: var(--accent-text); font-weight: 600; cursor: pointer; }
  #cs .hint { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
