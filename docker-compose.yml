services:
  dnd-web:
    build: .
    container_name: dnd-web
    command: >
      sh -c "uv run manage.py migrate --noinput &&
             uv run uvicorn config.asgi:application --host 0.0.0.0 --port 3000 --workers 3"
#    ports:
#      - "3000:3000"
    depends_on:
      dnd-db:
        condition: service_healthy
    env_file:
      - .env
    # The web app (the part exposed to the internet) never gets the LLM credentials: only
    # `dnd-translator` below holds them, so a compromised web process cannot read the key.
    # Empty values here override the ones `env_file` just loaded.
    environment:
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
    volumes:
      - ./media:/app/media
    restart: unless-stopped
    networks:
      - dnd-external
      - dnd-internal

  # Background worker translating Logbook entries and backstories between Italian and English
  # (see apps/frontend/translations.py). No published port, not on the external network: it only
  # talks to the database and to the LLM endpoint.
  dnd-translator:
    build: .
    container_name: dnd-translator
    command: uv run manage.py translate_worker
    depends_on:
      dnd-db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - dnd-internal

  dnd-db:
    image: postgres:16
    container_name: dnd-postgres
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5462:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dnd-internal

networks:
  dnd-internal:
    driver: bridge
  dnd-external:
    external: true