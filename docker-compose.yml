services:
  dnd-web:
    build: .
    container_name: dnd-web
    command: >
      sh -c "uv run manage.py migrate --noinput &&
             uv run uvicorn config.asgi:application --host 0.0.0.0 --port 3000"
#    ports:
#      - "3000:3000"
    depends_on:
      dnd-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    restart: unless-stopped
    networks:
      - dnd-external
      - dnd-internal

  dnd-db:
    image: postgres:16
    container_name: dnd-postgres
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5462:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dnd-internal

networks:
  dnd-internal:
    driver: bridge
  dnd-external:
    external: true